<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>NESTIR · 店家後台（原型）</title>
    <link rel="stylesheet" href="src/portal.css?v=20260829-3" />
    <link rel="stylesheet" href="src/merchant.css?v=20260829-2" />
  </head>
  <body class="merchant-body">
    <main class="merchant">
      <header class="merchant-top">
        <a class="portal-brand" href="portal.html">
          <span class="portal-compass" aria-hidden="true"><i></i></span>
          <span>NESTIR</span>
        </a>
        <span id="modeBadge" class="merchant-badge">店家後台原型</span>
      </header>

      <!-- 營運模式：金鑰解鎖 -->
      <section id="operatorGate" class="merchant-gate" hidden>
        <h1>店家開店（營運）</h1>
        <p>輸入營運金鑰以建立店家帳號並產生 QR 登入。</p>
        <div class="merchant-gate__row">
          <input id="adminKey" type="password" placeholder="營運金鑰" autocomplete="off" />
          <button id="unlockBtn" type="button" class="portal-enter merchant-unlock">解鎖</button>
        </div>
        <p id="authError" class="merchant-error" hidden></p>
      </section>

      <!-- 營運儀表板 -->
      <section id="operatorDash" class="merchant-dash" hidden>
        <div class="merchant-dash__head">
          <div><h1>店家開店</h1><p class="merchant-meta">建立店家帳號 → 產生 QR → 店家掃描即登入</p></div>
        </div>

        <div class="merchant-onboard">
          <h2>開新店</h2>
          <div class="merchant-onboard__row">
            <label>店名<input id="venueName" type="text" placeholder="例如 Cafe Chico"/></label>
            <label>網址 slug（選填）<input id="venueSlug" type="text" placeholder="cafe-chico"/></label>
          </div>
          <label class="merchant-row__check"><input type="checkbox" id="consent" /> 店家已同意取用其 Google 資料並建立帳號</label>
          <div class="merchant-onboard__actions">
            <button id="onboardBtn" type="button" class="portal-enter merchant-unlock">建立帳號 + 產生 QR</button>
          </div>
          <div id="onboardResult" hidden>
            <p class="merchant-meta">店家登入網址（QR 內含）：</p>
            <p class="merchant-onboard__url" id="merchantUrl"></p>
            <div id="qr" class="merchant-qr"></div>
            <div class="merchant-onboard__actions">
              <button id="copyUrl" type="button" class="merchant-btn">複製網址</button>
            </div>
          </div>
        </div>

        <div class="merchant-stats" id="venueList"></div>
      </section>

      <!-- 店家儀表板 -->
      <section id="merchantDash" class="merchant-dash" hidden>
        <div class="merchant-dash__head">
          <div><h1 id="venueTitle">餐點資料</h1><p id="venueMeta" class="merchant-meta"></p></div>
          <button id="refreshBtn" type="button" class="merchant-quiet">重新整理</button>
        </div>
        <div class="merchant-stats">
          <div class="merchant-stat"><strong id="statTotal">0</strong><span>餐點總數</span></div>
          <div class="merchant-stat"><strong id="statImage">0</strong><span>有圖片</span></div>
          <div class="merchant-stat"><strong id="statNoImage">0</strong><span>無圖片</span></div>
          <div class="merchant-stat"><strong id="statAvailable">0</strong><span>供應中</span></div>
        </div>
        <div id="dishTable" class="merchant-table"></div>
      </section>
    </main>
    <script src="vendor/qrcode.js?v=20260829-1"></script>
    <script src="src/merchant.js?v=20260829-2"></script>
  </body>
</html>

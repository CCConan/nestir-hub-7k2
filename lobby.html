<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0A1E31" />    <title>NESTIR · 大廳</title>
    <link rel="stylesheet" href="src/lobby.css?v=20260829-2" />
  </head>
  <body class="lobby-body">
    <div id="lobby">
      <canvas id="scene" aria-label="NESTIR 3D 大廳"></canvas>
      <div id="labels" aria-hidden="true"></div>
      <div id="fallback" hidden></div>

      <header class="lobby-bar">
        <a class="lobby-brand" href="index.html">
          <span class="lobby-compass" aria-hidden="true"><i></i></span>
          <span>NESTIR</span>
        </a>
        <span class="lobby-title">大廳</span>
        <div class="lobby-actions">
          <button id="settingsBtn" class="lobby-gear" type="button" aria-label="設定" aria-expanded="false">
            <svg class="lobby-gear__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="3.2"/>
              <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.55V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1-1.55 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.55-1H3a2 2 0 1 1 0-4h.09a1.7 1.7 0 0 0 1.55-1 1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34h.09a1.7 1.7 0 0 0 1-1.55V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1 1.55 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87v.09a1.7 1.7 0 0 0 1.55 1H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.55 1Z"/>
            </svg>
          </button>
          <a class="lobby-exit" href="index.html">入口</a>
        </div>
      </header>

      <div id="settingsPanel" class="settings-panel" hidden>
        <div class="settings-panel__title">設定</div>
        <div class="settings-row">
          <span>介面模式</span>
          <div class="settings-seg" role="group" aria-label="介面模式">
            <button type="button" class="settings-seg__btn" data-mode="3d">3D 空間</button>
            <button type="button" class="settings-seg__btn" data-mode="2d">2D 平面</button>
          </div>
        </div>
        <p id="modeNote" class="settings-note"></p>
        <button id="resetView" type="button" class="settings-reset">重置視角</button>
      </div>

      <p id="hint" class="lobby-hint">移動指標環顧 · 點擊節點進入工具</p>
    </div>
    <script type="module" src="lobby.bundle.js"></script>
  </body>
</html>
